title: "Bhavya Berlia — Strategy, operations & product"
description: "Bhavya Berlia works at the intersection of strategy, operations, and product, building what comes next in ambiguous environments."
url: "https://bhavyaberliaa.github.io"
baseurl: ""
lang: "en-US"
timezone: "America/Los_Angeles"
markdown: kramdown
permalink: pretty
highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
whitelist:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - PLAN.md
  - Gemfile
  - Gemfile.lock
  - replit.md
  - .agents
  - .local
  - .cache
  - .conversation
  - .replit
  - vendor
defaults:
  - scope:
      path: ""
    values:
      layout: default